# Fly.io deployment config for CertWatch backend.
#
# Replace `certwatch-backend` below with your unique app name when you run
# `fly launch` (or edit it manually before `fly deploy`).
#
# SQLite lives on a persistent volume mounted at /data — see [mounts] below.
# Set DATABASE_URL = "file:/data/prod.db" via `fly secrets set`.

app = "certwatch-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  NODE_ENV = "production"

[[mounts]]
  source = "certwatch_data"
  destination = "/data"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
